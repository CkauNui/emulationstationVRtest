name: Build Windows (VR mouse mode)

on:
  workflow_dispatch:
  push:
    branches: [ vr-mouse-mode ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # x64 = 64-bit, Win32 = 32-bit. Use the one that matches your Retrobat's emulationstation.exe.
        platform: [ x64, Win32 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMakeLists.txt downloads the Windows libraries (SDL2, FreeImage, curl, VLC...)
      # from batocera-emulationstation-win32-dependencies on its own (FetchContent).
      - name: Configure
        shell: pwsh
        # No -G on purpose: CMake picks the Visual Studio installed on the runner.
        # The -D values are quoted because PowerShell would otherwise cut "3.5" at the dot.
        run: cmake -S . -B build -A ${{ matrix.platform }} "-DRETROBAT=ON" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        shell: pwsh
        # ES compiles with a very strict warning level (tens of thousands of lines, GitHub truncates the log),
        # so only errors are printed: the real failure, if any, is then visible at the end of this step.
        run: cmake --build build --config Release --parallel -- "/nologo" "/clp:ErrorsOnly"

      - name: Collect emulationstation.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter emulationstation.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch '[\\/]win32-libs[\\/]' } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "emulationstation.exe was not produced" }
          Write-Host "Built: $($exe.FullName)  ($([math]::Round($exe.Length/1MB,2)) MB)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist/emulationstation.exe
          Copy-Item VR-MOUSE-MODE.md dist/VR-MOUSE-MODE.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
